x solid #efe9df;font-size:16px}ol.steps li:last-child{border-bottom:none}ol.steps li::before{content:counter(s);position:absolute;left:0;top:11px;width:30px;height:30px;background:#ff8a3d;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}.tip{background:#f0f7f0;border-radius:12px;padding:14px 16px;font-size:15px;margin-top:8px}.tip b{color:#2e7d32}.foot{padding:22px 24px 40px;font-size:12px;color:#9a9384;text-align:center}.foot .notice{background:#f4f1ec;border-radius:10px;padding:12px;margin-bottom:14px;line-height:1.5}.hub-card{display:block;color:inherit;text-decoration:none;background:#fff;border:1px solid #efe9df;border-radius:14px;padding:17px;margin:10px 0;box-shadow:0 5px 18px rgba(85,63,36,.07)}.hub-card b{font-size:18px}.hub-card p{font-size:14px;color:#8a8377;margin-top:4px}.empty{text-align:center;padding:46px 20px;color:#8a8377}a:focus-visible{outline:3px solid #222;outline-offset:3px}@media(min-width:700px){.wrap{box-shadow:0 0 35px rgba(80,58,30,.1)}}.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}.filter{border:1px solid #ffcf99;background:#fff;color:#99500f;border-radius:999px;padding:7px 13px;font-weight:700;white-space:nowrap}.filter.active{background:#ff8a3d;color:#fff}.hub-card{display:flex;flex-direction:column}.hub-card small{color:#e57517;font-weight:700;margin-bottom:3px}.hub-card[hidden]{display:none}</style></head><body><main class="wrap"><header class="hero"><div class="brand">집밥샵</div><h1>오늘 뭐 먹지?</h1><p>쉽고 맛있는 집밥 레시피와 필요한 재료를 모았어요.</p><span class="tag">🍳 레시피 아카이브</span></header><section class="sec"><h2>최신 레시피</h2><div class="filters"><button class="filter active" data-category="전체">전체</button><button class="filter" data-category="집밥">집밥</button></div><a class="hub-card" data-category="집밥" href="r/dak-gasumsal/"><small>집밥</small><b>퍽퍽함 사라지는 촉촉 닭가슴살</b><p>굽기 전 딱 한 단계로 겉은 노릇, 속은 촉촉하게.</p></a></section><footer class="foot"><div class="notice">쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>집밥샵 · 자취 그로서리 레시피</footer></main><script>for(const b of document.querySelectorAll('.filter'))b.onclick=()=>{const c=b.dataset.category;for(const x of document.querySelectorAll('.hub-card'))x.hidden=c!=="전체"&&x.dataset.category!==c;for(const x of document.querySelectorAll('.filter'))x.classList.toggle('active',x===b)};</script></body></html>
